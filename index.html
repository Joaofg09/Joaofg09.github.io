<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JPFG Apps</title>
<meta name="description" content="Aplicativos simples, leves e feitos com cuidado, para o dia a dia. Conheça os apps da JPFG Apps.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231F3A5F'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='26' font-weight='700' text-anchor='middle' fill='white'%3EJP%3C/text%3E%3C/svg%3E">
<style>
  :root { --fundo:#F6F7F9; --cartao:#FFFFFF; --texto:#1C2330; --suave:#5A6475; --marca:#1F3A5F; --marca-texto:#FFFFFF;
          --destaque:#2F6B5F; --borda:#E2E6EC; --chip:#EEF2F7; }
  @media (prefers-color-scheme: dark) {
    :root { --fundo:#0F1318; --cartao:#181E26; --texto:#ECEFF4; --suave:#A8B2C1; --marca:#8FB3E0; --marca-texto:#0F1318;
            --destaque:#7CC4B2; --borda:#2A323D; --chip:#222A35; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fundo); color:var(--texto); font:18px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:56px 16px 32px; text-align:center; }
  .logo { width:72px; height:72px; border-radius:20px; background:var(--marca); color:var(--marca-texto);
          display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:28px; letter-spacing:-.5px; }
  h1 { margin:16px 0 4px; font-size:2.1rem; line-height:1.2; }
  header p { margin:0 auto; max-width:560px; color:var(--suave); }
  main { max-width:880px; margin:0 auto; padding:0 16px 48px; }
  .grade { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px; }
  .app { background:var(--cartao); border:1px solid var(--borda); border-radius:18px; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .topo { display:flex; align-items:center; gap:14px; }
  .topo img { width:64px; height:64px; border-radius:16px; flex-shrink:0; background:var(--chip); }
  .topo h2 { margin:0; font-size:1.2rem; line-height:1.3; }
  .status { display:inline-block; margin-top:4px; font-size:.8rem; font-weight:700; padding:2px 10px; border-radius:999px;
            background:var(--chip); color:var(--suave); }
  .status.disponivel { color:var(--destaque); }
  .app p { margin:0; color:var(--suave); font-size:1rem; flex-grow:1; }
  .acoes { display:flex; flex-wrap:wrap; gap:8px; }
  .acoes a { text-decoration:none; font-weight:700; font-size:.95rem; padding:10px 14px; border-radius:12px; }
  .principal { background:var(--marca); color:var(--marca-texto); }
  .secundario { background:var(--chip); color:var(--texto); }
  .vazio { text-align:center; color:var(--suave); }
  footer { text-align:center; color:var(--suave); font-size:.9rem; padding:24px 16px 48px; }
  footer a { color:var(--marca); }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">JP</div>
  <h1>JPFG Apps</h1>
  <p>Aplicativos simples, leves e feitos com cuidado para o dia a dia.</p>
</header>
<main>
  <div class="grade" id="apps" aria-live="polite"></div>
  <noscript><p class="vazio">Ative o JavaScript para ver a lista de apps.</p></noscript>
</main>
<footer>
  Contato: <a href="mailto:jpapps.contato@gmail.com">jpapps.contato@gmail.com</a>
</footer>
<script>
  const el = document.getElementById('apps');
  const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  fetch('apps.json', { cache: 'no-cache' })
    .then((r) => r.json())
    .then((apps) => {
      if (!apps.length) { el.innerHTML = '<p class="vazio">Em breve, novos apps por aqui.</p>'; return; }
      el.innerHTML = apps.map((a) => {
        const disponivel = a.play && a.status === 'disponível';
        return `<article class="app">
          <div class="topo">
            <img src="${esc(a.icone)}" alt="" loading="lazy">
            <div><h2>${esc(a.nome)}</h2><span class="status${disponivel ? ' disponivel' : ''}">${disponivel ? 'Disponível na Google Play' : 'Em breve'}</span></div>
          </div>
          <p>${esc(a.descricao)}</p>
          <div class="acoes">
            ${disponivel ? `<a class="principal" href="${esc(a.play)}">Baixar</a>` : ''}
            <a class="${disponivel ? 'secundario' : 'principal'}" href="${esc(a.site)}">Conhecer</a>
            <a class="secundario" href="${esc(a.privacidade)}">Privacidade</a>
          </div>
        </article>`;
      }).join('');
    })
    .catch(() => { el.innerHTML = '<p class="vazio">Não foi possível carregar a lista de apps agora.</p>'; });
</script>
</body>
</html>
